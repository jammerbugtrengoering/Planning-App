  ØVELSESUDGAVEN AF PLANLÆGNINGEN (29.9.2026)
  ===========================================

  En hel uge man kan planlægge så mange gange man vil, uden at noget af det er
  rigtigt. Filen taler ikke med databasen, gemmer ingenting og kan ikke komme til
  at røre en rigtig kunde eller medarbejder. Den kan åbnes fra appen (/proev.html),
  sendes i en mail eller vises for et rengøringsfirma, der overvejer løsningen.

  Søsteren til Proev-Worklist.html. Samme tanke: der er intet sted i den rigtige
  app, hvor man kan fejle sikkert — her koster et forkert tryk ingenting.

  ØVELSERNE
  Tretten små opgaver i den rækkefølge, en ny planlægger møder dem:
    1-4   ugeplanen: læse den, tildele, flytte, sætte en ekstra på (plusset)
    5-6   tiden: fordele den på én opgave, rette den på hele aftalen (30.9.2026)
    7-8   sygdom: meld en syg, fordel hendes opgaver
    9     ny aftale med en ny kunde
    10-12 indbakken: ønske om ny tid, kundebestilling, afvigelse
    13    fakturering

  TIDEN — DET VIGTIGSTE AT FORSTÅ (Jonn 30.9.2026)
  Varigheden er PR. PERSON. To på en opgave på 4 timer er 8 timers arbejde. Skal to
  dele fire timer, fordeles tiden i opgaven (serviceordren): 2 t til hver. Gælder
  ændringen HVER uge, rettes varigheden på aftalen i stedet — ikke på den enkelte
  opgave.
  Man kan hoppe frit rundt — øvelserne krydses af, når det, de beder om, faktisk
  er sket i ugeplanen, ikke når man trykker «videre».

  FORENKLET MED VILJE
  Den rigtige app har tidslinje, køretid, kompetencer, områder, tjeklister og
  meget mere. Her er kun det, der skal til for at forstå tankegangen. Navne,
  kunder og priser er opdigtede.

  RETTELSER
  Ugen står i START_OPGAVER, medarbejderne i MEDARBEJDERE og øvelserne i OEVELSER.
  Teksterne må gerne rettes. Ændres noget i den rigtige app, så ret også her —
  øvelsen må ikke lære folk noget, appen ikke længere gør.
-->

/* ── Tilstand ──────────────────────────────────────────────────────────────
   Alt i hukommelsen. Lukker man fanen, begynder man forfra — med vilje. */
let S;
function nulstil() {
  S = {
    skaerm: "velkomst",          // velkomst | uge | okonomi | slut
    opgaver: START_OPGAVER.map((o) => ({ ...o, hjaelpere: [], fordeling: {}, aftaleId: "af-" + o.id })),
    aabenId: null,               // opgave, hvis serviceordre er aaben
    aftaleVarighed: {},          // aftaleId -> timer (til «alle uger»-beskeden)
    plusId: null,                // opgave-id, der er ved at faa en ekstra paa
    blokke: [],                  // { emp, dag, art }
    faerdige: new Set(),
    aktuel: "laes",
    valgt: null,                 // opgave-id valgt til tryk-tryk
    vindue: null,                // null | "syg" | "aftale" | "indbakke"
    beskeder: [
      { id: "b1", art: "nytid", farve: "blaa", h: "Ønske om ny tid", t: "Mette · Fru Madsen · ønsker mandag i stedet for fredag", klaret: false },
      { id: "b2", art: "bestilling", farve: "blaa", h: "Bestilling fra kunde", t: "Familien Lund · Hovedrengøring, 4 t · ønsker torsdag", klaret: false },
      { id: "b3", art: "afvigelse", farve: "orange", h: "Mere tid end planlagt", t: "Tandlæge Riis · +25 min · «Maling i venteværelset, ekstra støvsugning og gulvvask.» — Jonas", klaret: false },
    ],
    fakt: {},                    // opgave-id -> klar
    sendt: false,
    lundOpgave: null,
    annesTor: [],
    sim: null,                   // { tilstand, dage: {dag: {pladser, foer, efter}} } — kun i hukommelsen
    simTilstand: "fri",
    simSnapshot: null,           // gammel fordeling for de godkendte opgaver (til «Rul tilbage»)
    simGodkendt: new Set(),      // dage, der er godkendt
    simRullet: false,
  };
}
nulstil();

const opgave = (id) => S.opgaver.find((o) => o.id === id);
const emp = (id) => MEDARBEJDERE.find((e) => e.id === id);
const blokeret = (e, d) => S.blokke.some((b) => b.emp === e && b.dag === d);
// Hvem er paa opgaven? Den foerste (emp) og de ekstra (hjaelpere) — ligesom assignees
// i den rigtige app. Varigheden gaelder pr. person, saa den taeller hos dem alle.
const paa = (o, e) => o.emp === e || (o.hjaelpere || []).includes(e);
const folkPaa = (o) => [o.emp, ...(o.hjaelpere || [])].filter(Boolean);
// Som planlagtFor/planlagtIAlt i den rigtige app: er tiden fordelt, gaelder hendes
// andel; ellers opgavens varighed, som er PR. PERSON.
const planlagtFor = (o, e) => (o.fordeling && o.fordeling[e] > 0 ? o.fordeling[e] : o.min);
const samlet = (o) => { const f = folkPaa(o); return f.length ? f.reduce((s, e) => s + planlagtFor(o, e), 0) : o.min; };
const brugt = (e, d) => S.opgaver.filter((o) => paa(o, e) && o.dag === d).reduce((s, o) => s + planlagtFor(o, e), 0);
const t = (m) => { const h = Math.floor(m / 60), r = m % 60; return r ? `${h},${Math.round(r / 6)} t` : `${h} t`; };
const kr = (n) => n.toLocaleString("da-DK", { maximumFractionDigits: 0 }) + " kr.";

/* ── Kontrol: er øvelsen gjort? ────────────────────────────────────────────── */
const KONTROL = {
  tildel: () => { const o = opgave("o15"); return o.emp === "mette" && o.dag === "tir"; },
  flyt: () => { const o = opgave("o11"); return o.dag === "tor" && o.emp === "jonas"; },
  ekstra: () => { const o = opgave("o12"); return o.emp === "jonas" && o.hjaelpere.includes("sara") && o.dag === "fre"; },
  tidfordel: () => { const o = opgave("o12"); return paa(o, "jonas") && paa(o, "sara") && o.fordeling.jonas === 120 && o.fordeling.sara === 120; },
  aftaletid: () => opgave("o14").min === 150,
  syg: () => blokeret("anne", "tor"),
  fordel: () => S.annesTor.length > 0 && S.annesTor.every((id) => { const o = opgave(id); return o.emp && o.emp !== "anne"; }),
  aftale: () => S.opgaver.some((o) => o.aftale && /birgit/i.test(o.kunde) && o.dag === "tir" && o.emp === "sara"),
  nytid: () => opgave("o9").dag === "man" && S.beskeder.find((b) => b.id === "b1").klaret,
  bestilling: () => S.lundOpgave && !!opgave(S.lundOpgave)?.emp,
  afvigelse: () => S.beskeder.find((b) => b.id === "b3").klaret,
  faktura: () => S.sendt,
  simuler: () => !!S.sim && S.sim.tilstand === "fri",
  simgodkend: () => S.simGodkendt.has("ons") && S.simRullet,
};

function tjek() {
  let ny = null;
  OEVELSER.forEach((o) => {
    if (!S.faerdige.has(o.id) && KONTROL[o.id] && KONTROL[o.id]()) { S.faerdige.add(o.id); ny = o; }
  });
  if (ny) {
    skaal("✓ " + ny.titel + " — klaret", true);
    if (S.aktuel === ny.id || S.faerdige.has(S.aktuel)) naeste();
  }
}
function naeste() {
  const i = OEVELSER.findIndex((o) => o.id === S.aktuel);
  const rest = [...OEVELSER.slice(i + 1), ...OEVELSER.slice(0, i + 1)].find((o) => !S.faerdige.has(o.id));
  if (rest) S.aktuel = rest.id;
  else setTimeout(() => { S.skaerm = "slut"; S.vindue = null; tegn(); }, 900);
}

let skaalTimer = null;
function skaal(tekst, godt) {
  document.querySelectorAll(".skaal").forEach((x) => x.remove());
  const d = document.createElement("div");
  d.className = "skaal" + (godt ? " godt" : "");
  d.textContent = tekst;
  document.body.appendChild(d);
  clearTimeout(skaalTimer);
  skaalTimer = setTimeout(() => d.remove(), 2600);
}

/* ── Handlinger ───────────────────────────────────────────────────────────── */
function flytOpgave(id, empId, dag) {
  const o = opgave(id);
  if (!o) return;
  if (o.udfoert) { skaal("Den er allerede udført — den flyttes ikke."); return; }
  if (empId && blokeret(empId, dag)) { skaal(`${emp(empId).navn} er syg ${DAGSNAVN[dag]}.`); return; }
  if (empId) o.hjaelpere = (o.hjaelpere || []).filter((x) => x !== empId);
  o.emp = empId; o.dag = dag; o.fraSyg = false;
  if (!empId) o.hjaelpere = [];
  S.valgt = null;
  if (empId && brugt(empId, dag) > KAPACITET) skaal(`Bemærk: ${emp(empId).navn} har nu mere end 7 timer ${DAGSNAVN[dag]}.`);
  tjek(); tegn();
}

function tilfoejEkstra(id, empId) {
  const o = opgave(id);
  if (!o || paa(o, empId)) return;
  if (blokeret(empId, o.dag)) { skaal(`${emp(empId).navn} er syg ${DAGSNAVN[o.dag]}.`); return; }
  o.hjaelpere.push(empId);
  S.vindue = null; S.plusId = null;
  const n = folkPaa(o).length;
  skaal(`${emp(empId).navn} er sat på «${o.kunde}» — ${n} × ${t(o.min)} = ${t(o.min * n)} samlet arbejde.`);
  tjek(); tegn();
}

function gemFordeling(id, vaerdier) {
  const o = opgave(id);
  const f = {};
  for (const [e, v] of Object.entries(vaerdier)) { const n = Math.round(Number(String(v).replace(",", "."))); if (n > 0) f[e] = n; }
  o.fordeling = f;
  S.vindue = null; S.aabenId = null;
  skaal(`Gemt — «${o.kunde}» er nu ${t(samlet(o))} samlet arbejde.`);
  tjek(); tegn();
}

function gemAftaleTid(aftaleId, timer) {
  const min = Math.round(Number(String(timer).replace(",", ".")) * 60);
  if (!(min > 0)) { skaal("Skriv varigheden i timer, fx 2,5."); return; }
  const rammer = S.opgaver.filter((o) => o.aftaleId === aftaleId && !o.udfoert);
  rammer.forEach((o) => { o.min = min; });
  S.vindue = null; S.aabenId = null;
  skaal(`Aftalen er rettet til ${t(min)} pr. person — det gælder alle kommende uger. Udførte opgaver er ikke rørt.`, true);
  tjek(); tegn();
}

function meldSyg(empId, dage, art) {
  dage.forEach((d) => {
    if (!blokeret(empId, d)) S.blokke.push({ emp: empId, dag: d, art });
    S.opgaver.filter((o) => o.dag === d && !o.udfoert && (o.hjaelpere || []).includes(empId))
      .forEach((o) => { o.hjaelpere = o.hjaelpere.filter((x) => x !== empId); });
    S.opgaver.filter((o) => o.emp === empId && o.dag === d && !o.udfoert).forEach((o) => {
      o.emp = null; o.fraSyg = emp(empId).navn;
      if (empId === "anne" && d === "tor") S.annesTor.push(o.id);
    });
  });
  S.vindue = null;
  skaal(`${emp(empId).navn} er meldt ${art === "ferie" ? "på ferie" : "syg"}. Hendes opgaver ligger i «Ikke tildelt».`);
  tjek(); tegn();
}

function gemAftale(f) {
  if (!f.kunde.trim()) { skaal("Skriv kundens navn."); return false; }
  if (!f.dage.length) { skaal("Vælg mindst én ugedag."); return false; }
  const aftaleId = "af-ny-" + Date.now();
  f.dage.forEach((d, i) => {
    S.opgaver.push({ id: "a" + Date.now() + i, aftaleId, hjaelpere: [], fordeling: {}, kunde: f.kunde.trim(), type: f.type, emp: f.emp || null, dag: d,
      tid: f.tid || null, min: Math.round(Number(f.timer || 2) * 60), aftale: true });
  });
  S.vindue = null;
  skaal("Aftalen er gemt — opgaverne er dannet for alle uger frem til udløb.", true);
  tjek(); tegn();
  return true;
}

/* ── Simulér uge (en lille udgave af src/simulering.js) ─────────────────────
   Hver person på en opgave er en «plads» med sine minutter. Pladserne fordeles på de
   medarbejdere, der ikke er syge, så kørslen MELLEM opgaverne bliver mindst mulig —
   uden at nogen får mere end 7 timer eller to opgaver, der overlapper (med køretid).
   Dag og klokkeslæt flyttes aldrig. Udførte opgaver og opgaver uden klokkeslæt bliver,
   hvor de er; i «Fast medarbejder» også de faste aftaler. */
const kmMellem = (a, b) => (!a || !b || a === b ? 0 : KM[a < b ? a + "|" + b : b + "|" + a] ?? 25);
const tilMin = (hhmm) => { const [h, m] = String(hhmm).split(":").map(Number); return h * 60 + m; };

function dagsTal(pladser, d) {
  // pladser: [{ o, emp, min }] → km og kr. pr. medarbejder og i alt, dage over 7 t
  let km = 0, over = 0;
  MEDARBEJDERE.forEach((e) => {
    const mine = pladser.filter((p) => p.emp === e.id && p.o.tid).sort((a, b) => tilMin(a.o.tid) - tilMin(b.o.tid));
    for (let i = 1; i < mine.length; i++) km += kmMellem(mine[i - 1].o.by, mine[i].o.by);
    if (pladser.filter((p) => p.emp === e.id).reduce((s, p) => s + p.min, 0) > KAPACITET) over++;
  });
  return { km, kr: km * KM_SATS, over };
}

function passer(pladser, empId, ny, d) {
  if (blokeret(empId, d)) return false;
  const mine = pladser.filter((p) => p.emp === empId);
  if (mine.some((p) => p.o.id === ny.o.id)) return false;                 // aldrig to pladser på samme opgave
  if (mine.reduce((s, p) => s + p.min, 0) + ny.min > KAPACITET) return false;
  if (!ny.o.tid) return true;
  const a0 = tilMin(ny.o.tid), a1 = a0 + ny.min;
  return mine.filter((p) => p.o.tid).every((p) => {
    const b0 = tilMin(p.o.tid), b1 = b0 + p.min, koer = Math.round(kmMellem(p.o.by, ny.o.by) * 1.2);
    return a1 + koer <= b0 || b1 + koer <= a0;
  });
}

function simulerDag(d, tilstand) {
  const dagens = S.opgaver.filter((o) => o.dag === d);
  const foer = [], laast = [], frie = [];
  dagens.forEach((o) => {
    const folk = folkPaa(o);
    const saeder = folk.length ? folk.map((e) => ({ o, foerEmp: e, min: planlagtFor(o, e) })) : [{ o, foerEmp: null, min: o.min }];
    saeder.forEach((p) => {
      if (p.foerEmp) foer.push({ o, emp: p.foerEmp, min: p.min });
      const bliver = o.udfoert || !o.tid || (tilstand === "fast" && o.fast && p.foerEmp);
      if (bliver && p.foerEmp) laast.push({ o, emp: p.foerEmp, min: p.min, foerEmp: p.foerEmp, laast: true });
      else frie.push(p);
    });
  });
  const pris = (pl) => { const t2 = dagsTal(pl, d); return t2.km + pl.filter((p) => !p.laast && p.emp !== p.foerEmp).length * 0.5; };
  // 1. Billigste indsættelse i klokkeslætsorden
  const pladser = [...laast];
  const ikke = [];
  frie.sort((a, b) => tilMin(a.o.tid || "23:59") - tilMin(b.o.tid || "23:59") || b.min - a.min).forEach((p) => {
    let bedst = null;
    MEDARBEJDERE.forEach((e) => {
      if (!passer(pladser, e.id, p, d)) return;
      const c = pris([...pladser, { ...p, emp: e.id }]);
      if (!bedst || c < bedst.c) bedst = { c, emp: e.id };
    });
    if (bedst) pladser.push({ ...p, emp: bedst.emp }); else ikke.push(p);
  });
  // 2. Forbedring: flyt én plads eller byt to, så længe det bliver billigere
  for (let runde = 0; runde < 20; runde++) {
    let bedre = false;
    for (let i = 0; i < pladser.length; i++) {
      if (pladser[i].laast) continue;
      const nu = pris(pladser);
      for (const e of MEDARBEJDERE) {
        if (e.id === pladser[i].emp) continue;
        const uden = pladser.filter((_, j) => j !== i);
        if (!passer(uden, e.id, pladser[i], d)) continue;
        const proev = [...uden, { ...pladser[i], emp: e.id }];
        if (pris(proev) < nu - 0.01) { pladser.splice(0, pladser.length, ...proev); bedre = true; break; }
      }
    }
    for (let i = 0; i < pladser.length && !bedre; i++) for (let j = i + 1; j < pladser.length && !bedre; j++) {
      const a = pladser[i], b = pladser[j];
      if (a.laast || b.laast || a.emp === b.emp) continue;
      const rest = pladser.filter((_, k) => k !== i && k !== j);
      if (!passer(rest, b.emp, a, d)) continue;
      const medA = [...rest, { ...a, emp: b.emp }];
      if (!passer(medA, a.emp, b, d)) continue;
      const proev = [...medA, { ...b, emp: a.emp }];
      if (pris(proev) < pris(pladser) - 0.01) { pladser.splice(0, pladser.length, ...proev); bedre = true; }
    }
    if (!bedre) break;
  }
  return { pladser, ikke, foer: dagsTal(foer, d), efter: dagsTal(pladser, d),
    skift: pladser.filter((p) => !p.laast && p.emp !== p.foerEmp) };
}

function simuler(tilstand) {
  const dage = {};
  DAGE.forEach(([d]) => { dage[d] = simulerDag(d, tilstand); });
  S.sim = { tilstand, dage };
  S.simTilstand = tilstand;
  S.skaerm = "sim";
  tjek(); tegn();
}

function godkendSim(dage) {
  if (!S.sim) return;
  const snap = S.simSnapshot || {};
  let n = 0;
  dage.forEach((d) => {
    const r = S.sim.dage[d];
    const opg = [...new Set(r.skift.map((p) => p.o.id))];
    opg.forEach((id) => {
      const o = opgave(id);
      if (!o || o.udfoert) return;
      if (r.ikke.some((p) => p.o.id === id)) return;       // en plads uden medarbejder: hele opgaven bliver
      if (!snap[id]) snap[id] = { emp: o.emp, hjaelpere: [...(o.hjaelpere || [])], fordeling: { ...(o.fordeling || {}) } };
      const mine = r.pladser.filter((p) => p.o.id === id);
      const hadFordeling = Object.keys(o.fordeling || {}).length > 0;
      o.emp = mine[0].emp;
      o.hjaelpere = mine.slice(1).map((p) => p.emp);
      o.fordeling = {};
      if (hadFordeling) mine.forEach((p) => { o.fordeling[p.emp] = p.min; });
      o.fraSyg = false;
      n++;
    });
    S.simGodkendt.add(d);
  });
  S.simSnapshot = snap;
  S.simRullet = false;
  S.sim = null; S.skaerm = "uge";
  skaal(n ? `Godkendt — ${n} opgave${n === 1 ? "" : "r"} har fået ny medarbejder. Medarbejderne får besked.` : "Der var intet at ændre.", true);
  tjek(); tegn();
}

function rulTilbage() {
  if (!S.simSnapshot) return;
  Object.entries(S.simSnapshot).forEach(([id, g]) => { const o = opgave(id); if (o && !o.udfoert) Object.assign(o, g); });
  S.simSnapshot = null; S.simRullet = true;
  skaal("Rullet tilbage — opgaverne har deres gamle medarbejdere igen.", true);
  tjek(); tegn();
}

function besked(id, svar) {
  const b = S.beskeder.find((x) => x.id === id);
  if (b.art === "nytid") {
    if (svar === "ja") { const o = opgave("o9"); o.dag = "man"; skaal("Godkendt — Fru Madsen er flyttet til mandag, og Mette har fået besked."); }
    else skaal("Afvist — Mette får besked om, at det bliver fredag.");
  }
  if (b.art === "bestilling") {
    if (svar === "ja") {
      const id2 = "lund-hr";
      S.opgaver.push({ id: id2, kunde: "Familien Lund", type: "privat", emp: null, dag: "tor", tid: null, min: 240, ekstra: true, hjaelpere: [], fordeling: {} });
      S.lundOpgave = id2;
      skaal("Godkendt — hovedrengøringen ligger nu i «Ikke tildelt» torsdag. Giv den en medarbejder.");
    } else skaal("Afvist — kunden får besked i portalen.");
  }
  if (b.art === "afvigelse") skaal("Kvitteret — afvigelsen er set og i orden.");
  b.klaret = true;
  tjek(); tegn();
}

const app = document.getElementById("app");
const esc = (x) => String(x ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const aabne = () => S.beskeder.filter((b) => !b.klaret).length;
const kanVendeTilbage = () => location.protocol === "http:" || location.protocol === "https:";

function topBjaelke() {
  const menu = S.skaerm === "velkomst" || S.skaerm === "slut" ? "" : `

    <div style="display:flex;gap:4px;align-items:flex-start"><b>${esc(o.kunde)}</b><button class="aabn" data-aabn="${o.id}" title="Åbn opgaven (serviceordren)">Åbn</button></div>
    ${o.type === "nexus" ? `<div class="betaler">betales af ${esc(o.betaler)}</div>` : ""}
    <div>${o.tid ? esc(o.tid) + " · " : ""}${radEmp && folkPaa(o).length > 1 ? `${t(planlagtFor(o, radEmp))} (i alt ${t(samlet(o))})` : t(o.min)}</div>
    ${o.udfoert ? `<span class="tag tag-groen">✓ udført</span>` : ""}
    ${o.fraSyg ? `<span class="tag tag-roed">fra ${esc(o.fraSyg)} (syg)</span>` : ""}
    ${o.ekstra ? `<span class="tag tag-groen">bestilt i portalen</span>` : ""}
    ${o.aftale ? `<span class="tag tag-groen">ny aftale</span>` : ""}
    ${o.emp ? `<div class="folk">
      ${folkPaa(o).map((e) => `<span class="av" title="${esc(emp(e).navn)}${e === radEmp ? " (denne række)" : ""}" style="${e === radEmp ? "background:#111" : ""}">${esc(emp(e).navn.slice(0, 2).toUpperCase())}</span>`).join("")}
      ${!o.udfoert && MEDARBEJDERE.some((e) => !paa(o, e.id)) ? `<button class="plus" data-plus="${o.id}" title="Sæt flere medarbejdere på opgaven">+</button>` : ""}

}

function ugeplan() {

    </div>
    <div class="hint">${S.valgt ? `«${esc(opgave(S.valgt).kunde)}» er valgt — tryk på det felt, den skal flyttes til. <a href="#" data-fravaelg>Fortryd</a>` : "Træk et kort til et andet felt — eller tryk på kortet og derefter på feltet."}</div>

        }).join("")}
      </tr>`).join("")}
    </table></div>`;
}

function simVisning() {
  const r = S.sim;
  const sum = (k, hvad) => DAGE.reduce((s, [d]) => s + r.dage[d][k][hvad], 0);
  const kmF = sum("foer", "km"), kmE = sum("efter", "km"), krF = sum("foer", "kr"), krE = sum("efter", "kr");
  const overF = sum("foer", "over"), overE = sum("efter", "over");
  const skift = DAGE.reduce((s, [d]) => s + r.dage[d].skift.length, 0);
  const ikke = DAGE.reduce((s, [d]) => s + r.dage[d].ikke.length, 0);
  const navn = (id) => (id ? emp(id).navn : "Ikke tildelt");
  return `
    <div class="sim-banner">🔀 SIMULERING — intet er gemt, før du godkender
      <span style="margin-left:auto" class="skifter">
        <button data-simtilstand="fast" class="${r.tilstand === "fast" ? "valgt" : ""}">Fast medarbejder</button>
        <button data-simtilstand="fri" class="${r.tilstand === "fri" ? "valgt" : ""}">Fri medarbejder</button>
      </span></div>
    <div class="sim-tal">
      <div>Kørsel mellem opgaver<b>${kmF} → ${kmE} km</b>${kmE < kmF ? `<span class="bedre">−${kmF - kmE} km</span>` : "ingen besparelse"}</div>
      <div>Kørselsgodtgørelse (${String(KM_SATS).replace(".", ",")} kr./km)<b>${kr(krF)} → ${kr(krE)}</b>${krE < krF ? `<span class="bedre">−${kr(krF - krE)} på ugen</span>` : ""}</div>
      <div>Dage over 7 timer<b>${overF} → ${overE}</b></div>
      <div>Pladser med ny medarbejder<b>${skift}</b>${ikke ? `<span style="color:var(--roed);font-weight:800">${ikke} kan ikke placeres</span>` : "kunderne mærker det"}</div>
    </div>
    <div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap">
      <button class="knap knap-groen" data-simgodkend="alle" ${skift ? "" : "disabled"}>Godkend hele ugen</button>
      <button class="knap knap-hvid" data-simluk>Luk uden at gemme</button>
    </div>
    ${DAGE.map(([d, n]) => {
      const x = r.dage[d];
      const raekker = [...new Set([...x.pladser, ...x.ikke].map((p) => p.o.id))].map((id) => opgave(id))
        .sort((a, b) => tilMin(a.tid || "23:59") - tilMin(b.tid || "23:59"));
      return `<div class="sim-dag">
        <h4>${n} <span style="font-weight:600;color:var(--daempet);font-size:13px">${x.foer.km} → ${x.efter.km} km</span>
          ${S.simGodkendt.has(d) && !S.simRullet ? `<span class="tag tag-groen" style="font-size:11px;padding:2px 8px;border-radius:99px">godkendt</span>` : ""}
          <button class="knap knap-hvid" style="margin-left:auto;padding:6px 12px;font-size:13px" data-simgodkend="${d}" ${x.skift.length ? "" : "disabled"}>Godkend ${DAGSNAVN[d]}</button></h4>
        <table>${raekker.map((o) => {
          const efter = x.pladser.filter((p) => p.o.id === o.id);
          const uden = x.ikke.filter((p) => p.o.id === o.id);
          const foer = folkPaa(o);
          const skiftet = efter.some((p) => !p.laast && p.emp !== p.foerEmp) || uden.length;
          return `<tr class="${skiftet ? "skift" : ""}"><td style="width:52px">${esc(o.tid || "—")}</td><td><b>${esc(o.kunde)}</b> <span style="color:var(--daempet)">${esc(o.by || "")}</span></td>
            <td>${foer.length ? foer.map(navn).join(" + ") : "Ikke tildelt"}</td>
            <td>${skiftet ? "→ <b>" + [...efter.map((p) => navn(p.emp)), ...uden.map(() => "ikke placeret")].join(" + ") + "</b>" : o.udfoert ? "udført — bliver" : efter.some((p) => p.laast) ? "bliver" : "samme"}</td></tr>`;
        }).join("")}</table></div>`;
    }).join("")}
    <div class="hint">Kun kørsel mellem opgaverne samme dag tæller — ikke turen hjemmefra. To på én opgave er to pladser: de får hver sin medarbejder, samme klokkeslæt og hver deres minutter.</div>`;
}

function okonomi() {
  const udf = S.opgaver.filter((o) => o.udfoert);
  const alleKlar = udf.every((o) => S.fakt[o.id]);
  const sum = udf.reduce((s, o) => s + (o.brugt || o.min) / 60 * TIMEPRIS, 0);
  return `
    <h2 style="margin:0 0 4px">Fakturering</h2>
    <div class="hint">Ugens udførte opgaver. Tiden er den, medarbejderen har registreret i Worklist. Opdigtede priser.</div>
    <table class="fakt">
      <tr><th><input type="checkbox" data-alle ${alleKlar ? "checked" : ""} ${S.sendt ? "disabled" : ""}></th><th>Kunde</th><th>Dag</th><th>Medarbejder</th><th class="tal">Tid</th><th class="tal">Beløb</th></tr>
      ${udf.map((o) => `<tr>
        <td><input type="checkbox" data-klar="${o.id}" ${S.fakt[o.id] ? "checked" : ""} ${S.sendt ? "disabled" : ""}></td>
        <td>${esc(o.kunde)}${o.brugt ? ` <span class="tag tag-roed" style="font-size:11px;padding:1px 6px;border-radius:99px">+${o.brugt - o.min} min</span>` : ""}</td>
        <td>${DAGSNAVN[o.dag]}</td><td>${esc(emp(o.emp)?.navn || "")}</td>
        <td class="tal">${t(o.brugt || o.min)}</td><td class="tal">${kr((o.brugt || o.min) / 60 * TIMEPRIS)}</td></tr>`).join("")}
      <tr><td></td><td colspan="4"><b>I alt</b></td><td class="tal"><b>${kr(sum)}</b></td></tr>
    </table>
    <div style="display:flex;gap:10px;margin-top:14px;align-items:center;flex-wrap:wrap">
      <button class="knap knap-pink" data-send ${!alleKlar || S.sendt ? "disabled" : ""}>${S.sendt ? "✓ Sendt til fakturering" : "Send til fakturering"}</button>
      <span class="hint" style="margin:0">${S.sendt ? "I den rigtige app går de nu videre til Dinero eller til en Excel-fil." : "Markér hver linje som klar — eller alle på én gang øverst."}</span>
    </div>`;
}

function velkomst() {
  return `<div class="velkomst">
    <h1>Prøv planlægningen</h1>
    <p>En hel uge med fire medarbejdere og tyve opgaver — og intet af det er rigtigt. Du kan ikke komme til at ødelægge noget, og ingen kan se, hvad du trykker på.</p>
    <p>Til højre står femten små øvelser. De krydses af, når du har gjort det, de beder om. Du må tage dem i den rækkefølge, du vil, og starte forfra så tit, du vil.</p>
    <p style="font-size:14px;color:var(--daempet)">Den rigtige app kan mere: tidslinje, køretid, kompetencer, områder, tjeklister. Her er kun det, der skal til for at forstå tankegangen. Navne og priser er opdigtede.</p>
    <button class="knap knap-pink" data-begynd style="font-size:16px;padding:12px 22px;margin-top:6px">Begynd øvelsen</button>
  </div>`;
}

function slut() {
  return `<div class="velkomst">
    <div style="font-size:54px">🎉</div>
    <h1>Femten ud af femten</h1>
    <p>Du har planlagt en hel uge: tildelt og flyttet opgaver, sat en ekstra på, fordelt tiden og rettet en aftale, håndteret en sygemelding, oprettet en fast aftale, ryddet indbakken, sendt ugen til fakturering og simuleret en uge med mindre kørsel.</p>
    <div class="afsnit">Det du har prøvet</div>
    <ul class="liste">${OEVELSER.map((o) => `<li class="faerdig"><span class="boks">✓</span>${esc(o.titel)}</li>`).join("")}</ul>
    <div class="afsnit" style="margin-top:16px">De to ting, du skal huske</div>
    <div class="nu" style="margin:6px 0 10px"><p>«Ikke tildelt» er ikke et sted, opgaver venter — det er et sted, de bliver glemt. Ingen medarbejder ser dem. Kig der, hver gang nogen melder sig syg, og før du går hjem.</p></div>
    <div class="nu" style="margin:0 0 16px"><p>Varigheden er <b>pr. person</b>. Sætter du en ekstra på, fordobles arbejdet — skal de dele tiden, så fordel minutterne i opgaven. Gælder en ny tid hver uge, så ret den på <b>aftalen</b>, ikke på den enkelte opgave.</p></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${kanVendeTilbage() ? `<button class="knap knap-groen" data-tilbage>Tilbage til planlægningen</button>` : ""}
      <button class="knap knap-hvid" data-forfra>Prøv igen</button>
    </div>
  </div>`;
}

function tegn() {
  let krop;
  if (S.skaerm === "velkomst") krop = velkomst();
  else if (S.skaerm === "slut") krop = slut();
  else krop = `<div class="layout"><main>${S.skaerm === "okonomi" ? okonomi() : S.skaerm === "sim" && S.sim ? simVisning() : ugeplan()}</main>${guide()}</div>`;
  app.innerHTML = topBjaelke() + krop + vindue();
}

/* ── Hændelser ────────────────────────────────────────────────────────────── */
app.addEventListener("click", (e) => {
  const m = (sel) => e.target.closest(sel);
  if (m("[data-begynd]")) { S.skaerm = "uge"; tegn(); return; }
  if (m("[data-forfra]")) { nulstil(); S.skaerm = "uge"; tegn(); skaal("Ugen er sat tilbage til start."); return; }
  if (m("[data-tilbage]")) { location.href = "/"; return; }
  if (m("[data-nav]")) { S.skaerm = m("[data-nav]").dataset.nav; S.valgt = null; tegn(); return; }
  if (m("[data-vindue]")) { S.vindue = m("[data-vindue]").dataset.vindue; tegn(); return; }
  if (m("[data-luk]") && !m("[data-stop]") || m("header [data-luk]") || m("footer [data-luk]")) { S.vindue = null; tegn(); return; }
  if (m("[data-forstaaet]")) { S.faerdige.add("laes"); skaal("✓ Læs ugen — klaret", true); naeste(); tegn(); return; }
  if (m("[data-oevelse]")) { S.aktuel = m("[data-oevelse]").dataset.oevelse; tegn(); return; }
  if (m("[data-fravaelg]")) { e.preventDefault(); S.valgt = null; tegn(); return; }
  if (m("[data-gemsyg]")) {
    const dage = [...document.querySelectorAll(".sygDag:checked")].map((x) => x.value);
    if (!dage.length) { skaal("Vælg mindst én dag."); return; }
    meldSyg(document.getElementById("sygEmp").value, dage, document.getElementById("sygArt").value); return;
  }
  if (m("[data-gemaftale]")) {
    gemAftale({ kunde: document.getElementById("afKunde").value, type: document.getElementById("afType").value,
      timer: document.getElementById("afTimer").value, tid: document.getElementById("afTid").value,
      emp: document.getElementById("afEmp").value, dage: [...document.querySelectorAll(".afDag:checked")].map((x) => x.value) });
    return;
  }
  if (m("[data-besked]")) { const [id, svar] = m("[data-besked]").dataset.besked.split("|"); besked(id, svar); return; }
  if (m("[data-send]")) { S.sendt = true; skaal("Sendt til fakturering.", true); tjek(); tegn(); return; }
  if (m("[data-aabn]")) { S.aabenId = m("[data-aabn]").dataset.aabn; S.vindue = "ordre"; S.valgt = null; tegn(); return; }
  if (m("[data-aftale]")) { S.vindue = "aftaleTid"; tegn(); return; }
  if (m("[data-gemfordeling]")) {
    const v = {}; document.querySelectorAll(".andel").forEach((i) => { v[i.dataset.emp] = i.value; });
    gemFordeling(S.aabenId, v); return;
  }
  if (m("[data-gemaftaletid]")) { gemAftaleTid(m("[data-gemaftaletid]").dataset.gemaftaletid, document.getElementById("aftaleTimer").value); return; }
  if (m("[data-simuler]")) { simuler(S.simTilstand); return; }
  if (m("[data-simtilstand]")) { simuler(m("[data-simtilstand]").dataset.simtilstand); return; }
  if (m("[data-simgodkend]")) { const v = m("[data-simgodkend]").dataset.simgodkend; godkendSim(v === "alle" ? DAGE.map(([d]) => d) : [v]); return; }
  if (m("[data-simluk]")) { S.sim = null; S.skaerm = "uge"; tegn(); return; }
  if (m("[data-rultilbage]")) { rulTilbage(); return; }
  if (m("[data-plus]")) { S.plusId = m("[data-plus]").dataset.plus; S.vindue = "plus"; S.valgt = null; tegn(); return; }
  if (m("[data-ekstra]")) { tilfoejEkstra(S.plusId, m("[data-ekstra]").dataset.ekstra); return; }
  const kort = m("[data-kort]");
  if (kort) {
    const o = opgave(kort.dataset.kort);
    if (o.udfoert) { skaal("Udførte opgaver flyttes ikke — de skal faktureres, som de blev lavet."); return; }
    S.valgt = S.valgt === o.id ? null : o.id; tegn(); return;
  }
  const celle = m("[data-celle]");
  if (celle && S.valgt) { const [ei, d] = celle.dataset.celle.split("|"); flytOpgave(S.valgt, ei || null, d); }
});
app.addEventListener("input", (e) => {
  if (!e.target.matches(".andel") || !S.aabenId) return;
  const o = opgave(S.aabenId);
  let sum = 0; document.querySelectorAll(".andel").forEach((i) => { const n = Math.round(Number(i.value.replace(",", "."))); sum += n > 0 ? n : o.min; });
  const el = document.getElementById("ordreSum");
  if (el) el.innerHTML = `Samlet arbejde: <b>${t(sum)}</b> (ikke gemt endnu). Tomt felt = opgavens varighed, ${t(o.min)}.`;
});
app.addEventListener("change", (e) => {
  if (e.target.matches("[data-klar]")) { S.fakt[e.target.dataset.klar] = e.target.checked; tegn(); }
  if (e.target.matches("[data-alle]")) { S.opgaver.filter((o) => o.udfoert).forEach((o) => { S.fakt[o.id] = e.target.checked; }); tegn(); }
});
// Traek og slip (computer)
let traekker = null;
app.addEventListener("dragstart", (e) => { const k = e.target.closest("[data-kort]"); if (!k) return; traekker = k.dataset.kort; e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", traekker); });
app.addEventListener("dragover", (e) => { const c = e.target.closest("[data-celle]"); if (!c || !traekker) return; e.preventDefault(); document.querySelectorAll(".maal").forEach((x) => x !== c && x.classList.remove("maal")); c.classList.add("maal"); });
app.addEventListener("dragleave", (e) => { const c = e.target.closest("[data-celle]"); if (c && !c.contains(e.relatedTarget)) c.classList.remove("maal"); });
app.addEventListener("drop", (e) => { const c = e.target.closest("[data-celle]"); if (!c || !traekker) return; e.preventDefault(); const [ei, d] = c.dataset.celle.split("|"); const id = traekker; traekker = null; flytOpgave(id, ei || null, d); });
app.addEventListener("dragend", () => { traekker = null; document.querySelectorAll(".maal").forEach((x) => x.classList.remove("maal")); });

tegn();
</script>
</body>
</html>
